name: tests

# Run the search/render test suite on every push and pull request.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # app.test.js has no dependencies, so there is nothing to install.
      # It exits with code 1 if any assertion fails, which fails the job.
      - name: Run tests
        run: node app.test.js
        # If app.js / app.test.js live in a subfolder of the repo, set it here:
        # working-directory: path/to/folder
